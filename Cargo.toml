[package]
name = "amdgpu_blink"
version = "0.1.0"
edition = "2024"
description = "Show AMD GPU GFX utilization on a blink(1) LED"
license = "MIT"

[dependencies]
blink1rs = { version = "0.2", default-features = false }
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
serde_json = "1"
thiserror = "2"
